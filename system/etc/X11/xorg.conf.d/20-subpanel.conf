# The sub-LCD (card1) and its touch panel belong to subpaneld, not X.
# Without AutoAddGPU, X keeps card1 as a GPU screen and holds its DRM master,
# so fbdev writes to /dev/fb1 never reach the panel.
Section "ServerFlags"
	Option	"AutoAddGPU"	"false"
EndSection

Section "InputClass"
	Identifier	"sub panel touch"
	MatchProduct	"mxs-lradc-ts"
	Option	"Ignore"	"true"
EndSection

# subpaneld already applies the pointer acceleration; X's classic profile on
# top of it (factor 2, threshold 4) made two curves that kick in at different
# speeds.
Section "InputClass"
	Identifier	"sub panel touchpad"
	MatchProduct	"Brain sub panel touchpad"
	Option	"AccelerationProfile"	"-1"
EndSection
