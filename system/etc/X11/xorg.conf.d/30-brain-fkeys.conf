# The frame buttons 文字大・文字小 send KEY_F21 / KEY_F22: name them F21 / F22
# (the option brain:fkeys, added to the rules evdev by setup-xkb.sh) instead of
# XF86TouchpadToggle / On.
# For every keyboard, not only subpaneld's: X copies the keymap of the last
# keyboard used to the core keyboard, and SDL reads that one when it starts.
# Until the first key press after login the core keyboard still has the
# default keymap, so ../Xsession.d/45brain-fkeys applies the option to it too.
Section "InputClass"
	Identifier	"brain function keys"
	MatchIsKeyboard	"on"
	Option	"XkbOptions"	"brain:fkeys"
EndSection
