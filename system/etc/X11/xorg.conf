# The main display through DRM (modesetting) rather than fbdev: the fbdev
# emulation sends the picture to the panel at most every 50 ms (deferred I/O),
# so the pointer moved 20 times a second at most.
# Needs kernel/0016 (without it, X fails to set the mode and stays on the
# text screen). card0 is the main display, card1 the sub panel (subpaneld's).
Section "Device"
        Identifier "device"
        Driver     "modesetting"
        Option     "kmsdev" "/dev/dri/card0"
        Option     "AccelMethod" "none"
EndSection
Section "Screen"
        Identifier   "screen"
        Device       "device"
        DefaultDepth 16
EndSection
