# PW-A9300: sleep with "deep" (mem). Needs kernel/0009, which puts the DRAM
# into self-refresh and stops PLL0 while asleep and adds the time slept back
# to the clock from the RTC's seconds counter (the DT disables the RTC).
# Without 0009, "deep" is a single WFI that saves no more than s2idle and the
# clock falls behind by the time slept: use MemorySleepMode=s2idle there.
[Sleep]
MemorySleepMode=deep
