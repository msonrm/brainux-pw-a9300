# PW-A9300: a short press of the power button (入/切) suspends; hold it
# (5 seconds) to power off. The short press is left to subpaneld
# (userspace/subpanel), which shows a ring while the key is held and a moon,
# then asks for the suspend; logind would drop a press that comes while the
# last suspend is still finishing. Without subpaneld, set HandlePowerKey=suspend.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
