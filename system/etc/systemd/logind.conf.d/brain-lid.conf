# PW-A9300: the keyboard controller reports 5V coming and going (a hub on the
# OTG port) as SW_DOCK, so plugging the hub in while running makes logind
# "docked", and by default it then ignores the lid. Suspend on the lid either
# way. An app that wants to keep playing with the lid closed takes a
# handle-lid-switch inhibitor lock.
[Login]
HandleLidSwitchDocked=suspend
